# Render Blueprint for BypassX Management
# Configure BOT_TOKEN and BOT_OWNER_ID in the Render dashboard or secret group.

services:
  - type: worker
    name: bypassx-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && prisma generate
    startCommand: prisma migrate deploy && python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
